name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
    # Раскомментируйте следующую строку чтобы запускать на всех ветках:
    # branches: [ '*' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy bandit safety pylint

      - name: Check code formatting with Black
        run: |
          black --check --diff src tests

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff src tests

      - name: Lint with flake8
        run: |
          flake8 src tests --max-line-length=127 --extend-ignore=E203,W503

      - name: Type checking with mypy
        run: |
          mypy src --ignore-missing-imports --install-types --non-interactive
        continue-on-error: true

      - name: Security check with bandit
        run: |
          bandit -r src -ll

      - name: Check dependencies for vulnerabilities
        run: |
          safety check --json || true

      - name: Pylint analysis
        run: |
          pylint src --disable=C,R,W --errors-only
        continue-on-error: true

  complexity-check:
    name: Complexity Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install radon
        run: |
          pip install radon

      - name: Check cyclomatic complexity
        run: |
          radon cc src -a -nb

      - name: Check maintainability index
        run: |
          radon mi src -nb
